[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-marimo"
version = "0.1.0"
description = "playground for experimenting with the `marimo` library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair[all]>=6.0.0",
    "marimo[sql]>=0.17.8",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "platformdirs>=4.5.1",
    "plotly>=6.4.0",
    "polars>=1.35.2",
    "polars-iptools~=0.1.10",
    # "polars-iptools>=0.1.10",     # 0.2.1 is failing to build
    "pytest>=9.0.2",
    "pyzmq>=27.1.0",
    "tzlocal>=5.3.1",
]

[dependency-groups]
dev = [
    "marimo[mcp]>=0.17.8",
    "mypy>=1.18.2",
    "openai>=2.14.0",
    "pandas-stubs>=2.3.3.251201",
    "plotly-stubs>=0.0.6",
    "pylint>=4.0.3",
    "python-lsp-server>=1.13.2",
    "ruff>=0.14.5",
    "pytest>=9.0.2",
    "pydantic-ai>=1.51.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.marimo.formatting]
line_length = 100

[tool.marimo.display]
default_width = "full"

[tool.marimo.runtime]
pythonpath = ["./src"]

[tool.pylint.main]
py-version = "3.14"

[tool.mypy]
python_version = "3.14"

[tool.pylint.MASTER]
ignore-paths = ['^src/notebooks/marimo_bugs/']

[tool.pylint.basic]
# settings for marimo notebooks
# const-rgx = '([A-Z_][A-Z0-9_]*)|(__.*__)|__generated_with'
good-names = ["i", "j", "k", "_", "__generated_with"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    # settings for marimo notebooks
    "reimported",
    "import-outside-toplevel",
    "ungrouped-imports",
    "pointless-statement",
    "useless-return",
    # other settings
    "no-else-raise",            # do not prevent using elif
]

[tool.pyright]
pythonVersion = "3.14"
# settings for marimo notebooks
reportUnusedExpression = false

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
extend-select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear (common bugs)
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade checks
    "PL",       # ALL Pylint rules (Convention, Error, Refactor, Warning)
    ]
ignore = [
    "UP015",    # Unnecessary mode argument in open()
    "UP047",    # Generic function `*` should use type parameters
    ]

[tool.ruff.lint.per-file-ignores]
# notebooks
"src/notebooks/**.py" = [
    "B018",     # Found useless expression. Either assign it to a variable or remove it.
    "PLR1711",  # Useless `return` statement at end of function
    "PLC0415",  # `import` should be at the top-level of a file
]
# pytest files
"tests/**.py" = [
    "B011",     # Do not `assert False` (`python -O` removes these calls), raise `AssertionError()`
    "PLR2004",  # Magic value used in comparison, consider replacing `3` with a constant variable
]
"src/notebooks/experiments/python/pytest/**.py" = [
    "B011",     # Do not `assert False` (`python -O` removes these calls), raise `AssertionError()`
    "PLR2004",  # Magic value used in comparison, consider replacing `3` with a constant variable
]
"src/notebooks/marimo_bugs/**.py" = [
    "B011",     # Do not `assert False` (`python -O` removes these calls), raise `AssertionError()`
]

[tool.ruff.lint.isort]
lines-after-imports = 2
